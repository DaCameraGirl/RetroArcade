<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🕹️ RetroArcade</title>
<link rel="stylesheet" href="style.css?v=casino-lobby-hotspots-1">
</head>
<body class="deck-arcade">
<div class="scanlines"></div>

<header>
  <h1 id="lobby-title">🎰 RETRO ARCADE 🎰</h1>
  <p class="tag" id="lobby-subtitle">Pick a floor</p>
  <div id="breadcrumb" class="breadcrumb hidden"></div>
</header>

<!-- Lobby / Room floor -->
<div id="game-grid-wrap">
  <div id="game-grid" class="cabinet-grid"></div>
  <p class="arcade-hint">Pick a floor and play</p>
</div>

<!-- Play area -->
<div id="play-area" class="hidden">
  <div class="controls">
    <button id="backBtn">⬅ Back</button>
    <span id="game-title" class="game-title-label"></span>
    <label>Theme:
      <select id="deck">
        <option value="forest" selected>Forest</option>
        <option value="ocean">Ocean</option>
        <option value="meadow">Meadow</option>
        <option value="sunset">Sunset</option>
        <option value="classic">Classic</option>
      </select>
    </label>
    <label>Difficulty:
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </label>
    <button id="newGame">New Game</button>
    <button id="undo">Undo</button>
    <span id="moves">Moves: 0</span>
    <span id="timer">00:00</span>
    <button id="pauseBtn">⏸ Pause</button>
  </div>
  <main id="board"></main>
</div>

<!-- Win modal -->
<div id="win" class="hidden"><div class="win-box">
  <h2>🎉 YOU WIN!</h2>
  <p id="win-stats"></p>
  <button id="playAgain">Play Again</button>
  <button id="backToArcade" class="secondary">Back</button>
</div></div>

<footer>RetroArcade by <a href="https://github.com/DaCameraGirl/RetroArcade" target="_blank">DaCameraGirl</a></footer>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script src="games/snake/scene.js?v=casino-lobby-hotspots-1"></script>
<script src="games/slots/retro-reels.js?v=casino-lobby-hotspots-1"></script>
<script src="games/blackjack/table.js?v=casino-lobby-hotspots-1"></script>
<script src="games/sicbo/table.js?v=casino-lobby-hotspots-1"></script>
<script src="games.js?v=casino-lobby-hotspots-1"></script>
</body>
</html>
