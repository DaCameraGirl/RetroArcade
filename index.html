<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nature Arcade</title>
<link rel="stylesheet" href="style.css?v=20260825b">
</head>
<body class="deck-forest">
<header><h1>🌿 NATURE ARCADE</h1><p class="tag">Solitaire Puzzle Collection</p></header>
<nav class="game-select">
  <button class="game-btn active" data-game="klondike">♣️ Klondike</button>
  <button class="game-btn" data-game="tripeaks">⛰️ Tri-Peaks</button>
  <button class="game-btn" data-game="freecell">♦️ FreeCell</button>
</nav>
<div class="controls">
  <label>Theme: <select id="deck"><option value="forest" selected>Forest</option><option value="ocean">Ocean</option><option value="meadow">Meadow</option><option value="sunset">Sunset</option><option value="classic">Classic</option></select></label>
  <label>Difficulty: <select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></label>
  <button id="newGame">New Game</button>
  <button id="undo">Undo</button>
  <span id="moves">Moves: 0</span>
  <span id="timer">00:00</span>
  <button id="pauseBtn">⏸ Pause</button>
</div>
<main id="board"></main>
<div id="win" class="hidden"><div class="win-box"><h2>🎉 YOU WIN!</h2><p id="win-stats"></p><button id="playAgain">Play Again</button></div></div>
<footer>Nature Arcade — DaCameraGirl</footer>
<script src="games.js?v=20260825"></script>
</body>
</html>
